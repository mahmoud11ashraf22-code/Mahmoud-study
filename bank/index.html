<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b3d2e">
<title>🎲 بنك الحظ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(circle at 50% 0,#14604a,#07281e 70%);color:#fff;font-family:Tahoma,'Segoe UI',Arial,sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer}
#setup,#game{max-width:1000px;margin:0 auto;padding:10px}
.hide{display:none!important}
h1{text-align:center;margin:14px 0 4px;font-size:34px;text-shadow:0 3px 0 #0006}
.sub{text-align:center;opacity:.8;margin-bottom:14px}
.card{background:#ffffff14;border:1px solid #ffffff22;border-radius:16px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:100px;padding:10px;border-radius:10px;border:0;font-size:16px;font-family:inherit}
.row select{padding:10px;border-radius:10px;border:0;font-size:15px;font-family:inherit}
.btn{background:linear-gradient(#ffd54a,#f5a400);color:#3b2600;border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700;box-shadow:0 4px 0 #a36b00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a36b00}
.btn.g{background:linear-gradient(#5fe08a,#1fae57);color:#05301a;box-shadow:0 4px 0 #0f6b34}
.btn.r{background:linear-gradient(#ff8a80,#e53935);color:#fff;box-shadow:0 4px 0 #8e1a17}
.btn.d{background:#ffffff26;color:#fff;box-shadow:0 4px 0 #0005}
.btn.s{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.4}
#md .btn.d{background:#e3e7e5;color:#1b1b1b;box-shadow:0 4px 0 #9aa5a0}
#wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
#boardBox{width:min(100vw - 12px,620px,calc(100vh - 150px));width:min(calc(100vw - 12px),620px);aspect-ratio:1}
#board{direction:ltr;width:100%;height:100%;display:grid;grid-template:repeat(11,1fr)/repeat(11,1fr);gap:1px;background:#0a2a20;border:3px solid #0a2a20;border-radius:10px;position:relative}
.sq{background:#dff3e4;color:#10261b;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;text-align:center;cursor:pointer;direction:rtl;line-height:1.05}
.sq .bar{width:100%;height:24%;min-height:5px;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:700;gap:0}
.sq .nm{font-size:clamp(5.5px,1.55vw,9.5px);font-weight:700;padding:1px;word-break:break-word}
.sq .pr{font-size:clamp(5px,1.3vw,8px);opacity:.75;margin-top:auto}
.sq .ic{font-size:clamp(10px,3vw,20px);margin-top:1px}
.sq.corner{background:#fff3c4}
.sq.mort{filter:grayscale(1) brightness(.8)}
.sq .own{position:absolute;inset:auto 0 0 0;height:4px}
.sq .tk{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;pointer-events:none;align-content:center}
.tk span{font-size:clamp(9px,2.8vw,19px);filter:drop-shadow(0 1px 1px #000a);transition:transform .15s}
.sq.cur{box-shadow:inset 0 0 0 2px #ff0}
#center{grid-area:2/2/11/11;background:radial-gradient(circle,#1c7a5c,#0e4a37);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;direction:rtl;text-align:center;overflow:hidden}
#logo{font-size:clamp(16px,5vw,34px);font-weight:900;transform:rotate(-8deg);text-shadow:0 3px 0 #0007;color:#ffd54a;border:3px solid #ffd54a;border-radius:10px;padding:2px 10px}
#dice{display:flex;gap:10px;font-size:clamp(34px,11vw,64px);line-height:1}
.die{background:#fff;color:#111;border-radius:10px;padding:0 4px;box-shadow:0 3px 0 #0006}
.die.roll{animation:sh .25s infinite}
@keyframes sh{0%{transform:rotate(-12deg)}50%{transform:rotate(14deg) translateY(-4px)}100%{transform:rotate(-12deg)}}
#msg{font-size:clamp(10px,2.8vw,15px);min-height:2.6em;max-width:92%}
#panel{width:100%;max-width:620px}
#ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pl{background:#ffffff14;border:2px solid transparent;border-radius:12px;padding:8px;font-size:14px;position:relative}
.pl.on{border-color:#ffd54a;background:#ffd54a22}
.pl.out{opacity:.35;text-decoration:line-through}
.pl .mn{font-weight:800;font-size:18px;color:#8dffb0}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;min-height:10px}
.dots i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid #0008}
.dots i.m{opacity:.35}
#logbox{background:#0005;border-radius:12px;padding:8px;max-height:110px;overflow:auto;font-size:12.5px;margin-top:8px}
#logbox div{padding:1px 0;border-bottom:1px solid #ffffff10}
#ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
#md{background:#fff;color:#1b1b1b;border-radius:18px;padding:14px;width:min(94vw,440px);max-height:88vh;overflow:auto;box-shadow:0 10px 40px #000}
#md h3{margin:0 0 6px;font-size:20px}
#md .bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.deed{border:2px solid #222;border-radius:8px;overflow:hidden;margin:6px 0}
.deed .hd{padding:10px;text-align:center;color:#fff;font-weight:800;font-size:18px;text-shadow:0 1px 2px #0008}
.deed table{width:100%;font-size:14px;border-collapse:collapse}
.deed td{padding:3px 10px;border-bottom:1px solid #eee}
.deed td:last-child{text-align:left;font-weight:700}
.mrow{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid #eee;font-size:14px}
.mrow .c{width:14px;height:30px;border-radius:4px;flex:none}
.mrow .n{flex:1}
.mrow .bs{display:flex;gap:4px}
.chk{display:flex;align-items:center;gap:6px;padding:4px;font-size:14px}
.big{font-size:44px;text-align:center}
.tt{font-size:12px;opacity:.7;text-align:center;margin-top:6px}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#111d;color:#fff;padding:8px 16px;border-radius:20px;z-index:99;font-size:14px;pointer-events:none}
@media(min-width:900px){#wrap{flex-direction:row;align-items:flex-start;justify-content:center}#boardBox{width:min(620px,calc(100vh - 30px))}#panel{width:340px}}

.die{width:clamp(40px,12vw,62px);aspect-ratio:1;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11%;gap:3%;background:linear-gradient(145deg,#fff,#d9dedb)!important;border-radius:14%!important;box-shadow:0 4px 0 #0007,0 8px 14px #0005!important}
.pip{border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#000)}
.pip.o{visibility:hidden}
#dice{gap:12px!important}
.tk span.t{width:clamp(13px,3.6vw,22px);height:clamp(13px,3.6vw,22px);border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:clamp(8px,2.4vw,14px);box-shadow:0 0 0 1.5px #fff,0 2px 4px #000a;margin:.5px;filter:none}
.tk span.t.cur{animation:hop .7s infinite;z-index:3}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22%) scale(1.15)}}
.sq .nm{font-size:clamp(6px,1.75vw,10px)!important}
#turnTag{font-size:clamp(11px,3vw,16px);font-weight:800;padding:3px 12px;border-radius:20px;background:#0006;border:2px solid var(--c,#fff)}
#roundTag{font-size:clamp(9px,2.3vw,12px);opacity:.75}
.pl{overflow:visible;transition:transform .2s,background .2s}
.pl.on{transform:scale(1.03);box-shadow:0 0 14px #ffd54a88}
.pl .wl{font-size:11px;opacity:.7}
.fl{position:absolute;top:2px;left:8px;font-weight:900;font-size:17px;pointer-events:none;animation:fl 1.3s ease-out forwards;text-shadow:0 1px 3px #000;z-index:5}
.fl.up{color:#7dff9b}.fl.dn{color:#ff7b72}
@keyframes fl{0%{transform:translateY(8px);opacity:0}15%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
#md{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:120;pointer-events:none;animation:cf 3.2s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.pl .own-n{font-size:11px;opacity:.75}
.sq.flash{animation:flash .6s 2}
@keyframes flash{50%{filter:brightness(1.6) saturate(1.5)}}
.sel{padding:8px;border-radius:10px;border:0;font-family:inherit;font-size:14px}
.stat{width:100%;font-size:14px;border-collapse:collapse;margin-top:8px}.stat td{padding:3px 6px;border-bottom:1px solid #eee}.stat td:last-child{text-align:left;font-weight:700}
html.th-night,html.th-night body{background:radial-gradient(circle at 50% 0,#1b2a52,#080d1e 70%)}
.th-night .sq{background:#1f2c4a;color:#e8eefc}.th-night .sq.corner{background:#3a3150}.th-night #center{background:radial-gradient(circle,#2b3f80,#141c3f)}.th-night #board{background:#05081a;border-color:#05081a}
html.th-gold,html.th-gold body{background:radial-gradient(circle at 50% 0,#8a6420,#2b1c05 70%)}
.th-gold .sq{background:#fbf0d2}.th-gold .sq.corner{background:#ffd877}.th-gold #center{background:radial-gradient(circle,#c4932f,#6d4a10)}.th-gold #board{background:#3a2606;border-color:#3a2606}
</style>
</head>
<body>
<div id="setup">
  <h1>🎲 بنك الحظ</h1>
  <div class="sub">لعبة العقارات والمدن المصرية — اشتري، ابني، وأفلس خصومك!</div>
  <div class="card">
    <b>عدد اللاعبين</b>
    <div class="row" id="cnt"></div>
    <div id="pset"></div>
  </div>
  <div class="card">
    <div class="row"><b>الفلوس في البداية:</b>
      <select id="startMoney"><option value="1000">١٠٠٠ ج</option><option value="1500" selected>١٥٠٠ ج</option><option value="2500">٢٥٠٠ ج</option></select>
      <b>سرعة اللعب:</b>
      <select id="speed"><option value="1">عادي</option><option value="0.5">سريع</option><option value="0.1">سريع جدًا</option></select>
    </div>
    <div class="row"><label><input type="checkbox" id="parkPot"> 🅿️ جوائز الضرايب تتجمع في الاستراحة</label></div>
    <div class="row"><label><input type="checkbox" id="goBonus"> 🏁 ٤٠٠ ج لو وقفت على البداية بالظبط</label></div>
    <div class="row"><b>شكل اللعبة:</b><select id="theme" class="sel"><option value="">🌿 أخضر</option><option value="night">🌙 ليلي</option><option value="gold">👑 ذهبي</option></select></div>
  </div>
  <div class="row" style="justify-content:center">
    <button class="btn g" id="startBtn">▶️ ابدأ اللعب</button>
    <button class="btn d" id="contBtn">⏯ كمّل اللعبة المحفوظة</button>
    <button class="btn d" id="rulesBtn">📖 القواعد</button>
    <button class="btn d" id="shareBtn">📤 شارك</button>
  </div>
</div>

<div id="game" class="hide">
  <div id="wrap">
    <div id="boardBox"><div id="board"><div id="center">
      <div id="roundTag"></div><div id="turnTag"></div><div id="logo">بنك الحظ</div>
      <div id="dice"><span class="die"></span><span class="die"></span></div>
      <div id="msg"></div>
    </div></div></div>
    <div id="panel">
      <div id="ctrl"></div>
      <div id="players"></div>
      <div id="logbox"></div>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn d s" id="muteBtn">🔊</button>
        <button class="btn d s" id="musBtn">🎵</button>
        <button class="btn d s" id="menuBtn">☰ قائمة</button>
      </div>
    </div>
  </div>
</div>
<div id="ov" class="hide"><div id="md"></div></div>
<div id="toast" class="hide"></div>

<script>
'use strict';
/* ========== DATA ========== */
const GC={brown:'#8b5a2b',lb:'#7ec8f0',pink:'#e0559e',orange:'#f39a2b',red:'#d9322e',yellow:'#f2d12e',green:'#2fa35a',dk:'#2a4aa8',rail:'#444',util:'#888'};
const GN={brown:'بني',lb:'سماوي',pink:'وردي',orange:'برتقالي',red:'أحمر',yellow:'أصفر',green:'أخضر',dk:'أزرق غامق',rail:'محطات',util:'شركات'};
const S=[
 {t:'go',n:'البداية',ic:'🏁'},
 {t:'p',n:'سيوة',g:'brown',pr:60,hc:50,r:[2,10,30,90,160,250]},
 {t:'chest',n:'صندوق الحظ',ic:'🎁'},
 {t:'p',n:'مطروح',g:'brown',pr:60,hc:50,r:[4,20,60,180,320,450]},
 {t:'tax',n:'ضريبة الدخل',pr:200,ic:'💸'},
 {t:'rail',n:'محطة رمسيس',pr:200,ic:'🚆'},
 {t:'p',n:'الفيوم',g:'lb',pr:100,hc:50,r:[6,30,90,270,400,550]},
 {t:'chance',n:'فرصة',ic:'❓'},
 {t:'p',n:'بني سويف',g:'lb',pr:100,hc:50,r:[6,30,90,270,400,550]},
 {t:'p',n:'المنيا',g:'lb',pr:120,hc:50,r:[8,40,100,300,450,600]},
 {t:'jail',n:'السجن (زيارة)',ic:'⛓️'},
 {t:'p',n:'أسيوط',g:'pink',pr:140,hc:100,r:[10,50,150,450,625,750]},
 {t:'util',n:'شركة الكهرباء',pr:150,ic:'💡'},
 {t:'p',n:'سوهاج',g:'pink',pr:140,hc:100,r:[10,50,150,450,625,750]},
 {t:'p',n:'قنا',g:'pink',pr:160,hc:100,r:[12,60,180,500,700,900]},
 {t:'rail',n:'محطة مصر',pr:200,ic:'🚆'},
 {t:'p',n:'الأقصر',g:'orange',pr:180,hc:100,r:[14,70,200,550,750,950]},
 {t:'chest',n:'صندوق الحظ',ic:'🎁'},
 {t:'p',n:'أسوان',g:'orange',pr:180,hc:100,r:[14,70,200,550,750,950]},
 {t:'p',n:'الغردقة',g:'orange',pr:200,hc:100,r:[16,80,220,600,800,1000]},
 {t:'park',n:'استراحة مجانية',ic:'🅿️'},
 {t:'p',n:'دمياط',g:'red',pr:220,hc:150,r:[18,90,250,700,875,1050]},
 {t:'chance',n:'فرصة',ic:'❓'},
 {t:'p',n:'المنصورة',g:'red',pr:220,hc:150,r:[18,90,250,700,875,1050]},
 {t:'p',n:'طنطا',g:'red',pr:240,hc:150,r:[20,100,300,750,925,1100]},
 {t:'rail',n:'محطة سيدي جابر',pr:200,ic:'🚆'},
 {t:'p',n:'الإسماعيلية',g:'yellow',pr:260,hc:150,r:[22,110,330,800,975,1150]},
 {t:'p',n:'بورسعيد',g:'yellow',pr:260,hc:150,r:[22,110,330,800,975,1150]},
 {t:'util',n:'شركة المياه',pr:150,ic:'🚰'},
 {t:'p',n:'السويس',g:'yellow',pr:280,hc:150,r:[24,120,360,850,1025,1200]},
 {t:'gojail',n:'اذهب للسجن',ic:'👮'},
 {t:'p',n:'شرم الشيخ',g:'green',pr:300,hc:200,r:[26,130,390,900,1100,1275]},
 {t:'p',n:'دهب',g:'green',pr:300,hc:200,r:[26,130,390,900,1100,1275]},
 {t:'chest',n:'صندوق الحظ',ic:'🎁'},
 {t:'p',n:'الإسكندرية',g:'green',pr:320,hc:200,r:[28,150,450,1000,1200,1400]},
 {t:'rail',n:'محطة الجيزة',pr:200,ic:'🚆'},
 {t:'chance',n:'فرصة',ic:'❓'},
 {t:'p',n:'الجيزة',g:'dk',pr:350,hc:200,r:[35,175,500,1100,1300,1500]},
 {t:'tax',n:'ضريبة رفاهية',pr:100,ic:'💎'},
 {t:'p',n:'القاهرة',g:'dk',pr:400,hc:200,r:[50,200,600,1400,1700,2000]}
];
S.forEach((s,i)=>s.i=i);
const OWNABLE=s=>s.t==='p'||s.t==='rail'||s.t==='util';
const groupOf=s=>s.t==='p'?s.g:s.t;
const GROUPS={};S.forEach(s=>{if(OWNABLE(s)){(GROUPS[groupOf(s)]=GROUPS[groupOf(s)]||[]).push(s.i)}});
const TOKENS=['🚗','🐪','✈️','🎩','🐎','⛵'];
const PCOL=['#ff5252','#40c4ff','#ffd740','#b388ff','#69f0ae','#ff9e40'];
const CHANCE=[
 {t:'تقدّم لـ البداية وخد ٢٠٠ ج',f:async(p)=>moveTo(p,0,true)},
 {t:'تقدّم للقاهرة 🏙️',f:async(p)=>moveTo(p,39,true)},
 {t:'تقدّم لأسيوط',f:async(p)=>moveTo(p,11,true)},
 {t:'تقدّم لشرم الشيخ 🏖️',f:async(p)=>moveTo(p,31,true)},
 {t:'تقدّم لأقرب محطة، ولو ليها مالك ادفع ضعف الإيجار',f:async(p)=>{const r=[5,15,25,35];let t=r.find(x=>x>p.pos)??5;await moveTo(p,t,true,{rail2:true})}},
 {t:'البنك بيدفعلك أرباح ٥٠ ج',f:async(p)=>gain(p,50)},
 {t:'اخرج من السجن مجانًا (احتفظ بالكارت)',f:async(p)=>{p.jc++;G.chance.held=true},jail:true},
 {t:'ارجع ٣ خطوات',f:async(p)=>moveTo(p,(p.pos+37)%40,false)},
 {t:'اذهب مباشرة للسجن 👮',f:async(p)=>goJail(p)},
 {t:'صيانة عقاراتك: ٢٥ ج لكل بيت و١٠٠ ج لكل فندق',f:async(p)=>repairs(p,25,100)},
 {t:'غرامة سرعة: ادفع ١٥ ج',f:async(p)=>pay(p,15,null)},
 {t:'تقدّم لمحطة رمسيس 🚆',f:async(p)=>moveTo(p,5,true)},
 {t:'عيد ميلادك 🎂 خد ٥٠ ج من كل لاعب',f:async(p)=>eachPays(p,50,true)},
 {t:'رئيس مجلس الإدارة: ادفع ٥٠ ج لكل لاعب',f:async(p)=>eachPays(p,50,false)},
 {t:'تقدّم لـ الأقصر',f:async(p)=>moveTo(p,16,true)},
 {t:'كسبت مسابقة! خد ١٠٠ ج',f:async(p)=>gain(p,100)}
];
const CHEST=[
 {t:'خطأ بنكي لصالحك: خد ٢٠٠ ج',f:async(p)=>gain(p,200)},
 {t:'أتعاب الدكتور: ادفع ٥٠ ج',f:async(p)=>pay(p,50,null)},
 {t:'بعت أسهم: خد ٥٠ ج',f:async(p)=>gain(p,50)},
 {t:'اخرج من السجن مجانًا (احتفظ بالكارت)',f:async(p)=>{p.jc++;G.chest.held=true},jail:true},
 {t:'اذهب مباشرة للسجن 👮',f:async(p)=>goJail(p)},
 {t:'ورثت ١٠٠ ج من عمك',f:async(p)=>gain(p,100)},
 {t:'عيد الأضحى: خد ١٠ ج من كل لاعب',f:async(p)=>eachPays(p,10,true)},
 {t:'استرداد ضرائب: خد ٢٠ ج',f:async(p)=>gain(p,20)},
 {t:'تأمين على الحياة: خد ١٠٠ ج',f:async(p)=>gain(p,100)},
 {t:'مصاريف مستشفى: ادفع ١٠٠ ج',f:async(p)=>pay(p,100,null)},
 {t:'مصاريف مدرسة: ادفع ٥٠ ج',f:async(p)=>pay(p,50,null)},
 {t:'مكافأة: خد ٢٥ ج',f:async(p)=>gain(p,25)},
 {t:'إصلاح العقارات: ٤٠ ج لكل بيت و١١٥ ج لكل فندق',f:async(p)=>repairs(p,40,115)},
 {t:'تقدّم لـ البداية وخد ٢٠٠ ج',f:async(p)=>moveTo(p,0,true)}
];
/* ========== STATE ========== */
let G=null,SPEED=1,MUTE=false,AUTO=location.hash==='#auto',STOP=false;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,AUTO?0:ms*SPEED));
const fmt=n=>n.toLocaleString('ar-EG')+' ج';

const rnd=n=>Math.floor(Math.random()*n);

/* ========== RULES HELPERS ========== */
const owner=i=>G.props[i].o;
const ownedBy=(pi)=>Object.keys(G.props).filter(k=>G.props[k].o===pi).map(Number);
function hasSet(pi,g){return GROUPS[g].every(i=>G.props[i].o===pi)}
function countOwned(pi,g){return GROUPS[g].filter(i=>G.props[i].o===pi).length}
function rentOf(i,roll,mult){
  const s=S[i],q=G.props[i];if(q.o<0||q.m)return 0;
  let r=0;
  if(s.t==='p'){
    if(q.h>0)r=s.r[q.h];
    else r=s.r[0]*(hasSet(q.o,s.g)&&!GROUPS[s.g].some(x=>G.props[x].m)?2:1);
  }else if(s.t==='rail'){r=25*Math.pow(2,countOwned(q.o,'rail')-1);if(mult)r*=2}
  else{const n=countOwned(q.o,'util');r=(mult?10:(n===2?10:4))*(roll||7)}
  return r;
}
function netWorth(p){let w=p.money;ownedBy(G.players.indexOf(p)).forEach(i=>{const s=S[i],q=G.props[i];w+=q.m?s.pr/2:s.pr;if(s.t==='p')w+=q.h*s.hc});return Math.round(w)}
function canBuild(pi,i){
  const s=S[i],q=G.props[i];if(s.t!=='p'||q.o!==pi||q.m||q.h>=5)return false;
  if(!hasSet(pi,s.g))return false;if(GROUPS[s.g].some(x=>G.props[x].m))return false;
  if(G.players[pi].money<s.hc)return false;
  return q.h<=Math.min(...GROUPS[s.g].map(x=>G.props[x].h));
}
function canSell(pi,i){const s=S[i],q=G.props[i];if(s.t!=='p'||q.o!==pi||q.h<=0)return false;return q.h>=Math.max(...GROUPS[s.g].map(x=>G.props[x].h))}
function canMort(pi,i){const s=S[i],q=G.props[i];if(q.o!==pi||q.m)return false;if(s.t==='p'&&GROUPS[s.g].some(x=>G.props[x].h>0))return false;return true}
const unmortCost=i=>Math.ceil(S[i].pr/2*1.1);
function build(pi,i){const s=S[i],p=G.players[pi];p.money-=s.hc;G.props[i].h++;sfx.cash();log(`${p.name} بنى ${G.props[i].h===5?'فندق 🏨':'بيت 🏠'} في ${s.n}`)}
function sellHouse(pi,i){const s=S[i],p=G.players[pi];p.money+=s.hc/2;G.props[i].h--;log(`${p.name} باع بيت في ${s.n}`)}
function mortgage(pi,i){const p=G.players[pi];p.money+=S[i].pr/2;G.props[i].m=true;log(`${p.name} رهن ${S[i].n}`)}
function unmortgage(pi,i){const p=G.players[pi];p.money-=unmortCost(i);G.props[i].m=false;log(`${p.name} فك رهن ${S[i].n}`)}
function totalHouses(pi){let h=0,H=0;ownedBy(pi).forEach(i=>{const q=G.props[i];if(S[i].t==='p'){if(q.h===5)H++;else h+=q.h}});return[h,H]}
/* ========== MONEY ========== */
async function gain(p,a){p.money+=a;sfx.cash();log(`${p.name} استلم ${fmt(a)}`);render()}
async function pay(p,a,to){ // to: player object or null(bank)
  if(a<=0)return true;
  const ok=await ensureFunds(p,a,to);
  if(ok){p.money-=a;if(to)to.money+=a;else if(G.usePot)G.pot+=a;sfx.pay();render();return true}
  await bankrupt(p,to);return false;
}
async function repairs(p,h,H){const [a,b]=totalHouses(G.players.indexOf(p));await pay(p,a*h+b*H,null)}
async function eachPays(p,a,collect){
  for(const q of G.players){if(q===p||q.out||p.out)continue;
    if(collect)await pay(q,a,p);else await pay(p,a,q)}
}
async function ensureFunds(p,a,to){
  const pi=G.players.indexOf(p);
  while(p.money<a){
    if(p.ai){if(!aiRaise(pi))return false}
    else{
      const r=await manage(p,a,to);
      if(r==='bankrupt')return false;
    }
  }
  return true;
}
function aiRaise(pi){
  // sell houses first
  let best=null;
  for(const i of ownedBy(pi)){if(canSell(pi,i)){if(!best||S[i].hc>S[best].hc)best=i}}
  if(best!==null){sellHouse(pi,best);return true}
  const m=ownedBy(pi).filter(i=>canMort(pi,i)).sort((a,b)=>S[a].pr-S[b].pr);
  if(m.length){mortgage(pi,m[0]);return true}
  return false;
}
async function bankrupt(p,to){
  const pi=G.players.indexOf(p);
  log(`💀 ${p.name} أفلس!`+(to?` وكل ممتلكاته راحت لـ ${to.name}`:''));sfx.bad();
  const ti=to?G.players.indexOf(to):-1;
  for(const i of ownedBy(pi)){const q=G.props[i];
    if(q.h>0){q.h=0}
    q.o=ti;
    if(ti<0){q.m=false}
  }
  if(to){to.money+=Math.max(0,p.money);to.jc+=p.jc}
  p.money=0;p.out=true;p.jc=0;p.jail=0;
  if(!to){/* bank: props already unowned (auction skipped) */}
  render();
  if(!AUTO)await modal(`<div class="big">💀</div><h3 style="text-align:center">${p.name} أفلس!</h3><div class="tt">${to?'ممتلكاته انتقلت لـ '+to.name:'ممتلكاته رجعت للبنك'}</div>`,[{t:'تمام',v:1}]);
  if(to&&!to.ai&&ti>=0){/* transferred mortgaged props: nothing extra */}
  checkWin();
}

async function land(p,opts){
  const s=S[p.pos],pi=G.players.indexOf(p);
  if(p.out)return;
  if(OWNABLE(s)){
    const q=G.props[s.i];
    if(q.o<0){await offerBuy(p,s)}
    else if(q.o!==pi&&!q.m){
      const r=rentOf(s.i,G.lastRoll,opts.rail2||(opts.util10&&s.t==='util'));
      const to=G.players[q.o];
      log(`${p.name} دفع إيجار ${fmt(r)} لـ ${to.name} على ${s.n}`);
      await pay(p,r,to);
    }else if(q.o!==pi&&q.m)log(`${s.n} مرهونة، مفيش إيجار`);
    else log(`${p.name} وصل ملكه: ${s.n}`);
  }else if(s.t==='tax'){log(`${p.name} دفع ${s.n} ${fmt(s.pr)}`);await pay(p,s.pr,null)}
  else if(s.t==='chance')await drawCard(p,G.chance,CHANCE,'فرصة');
  else if(s.t==='chest')await drawCard(p,G.chest,CHEST,'صندوق الحظ');
  else if(s.t==='gojail')await goJail(p);
  else if(s.t==='park'){if(G.usePot&&G.pot>0){await gain(p,G.pot);log(`🅿️ ${p.name} خد جوايز الاستراحة ${fmt(G.pot)}`);G.pot=0}else log(`${p.name} في الاستراحة 😎`)}
  else if(s.t==='go')log(`${p.name} على البداية`);
  else if(s.t==='jail')log(`${p.name} بيزور السجن بس`);

/* ========== BUY / AUCTION ========== */
function aiWantsBuy(p,s){
  const pi=G.players.indexOf(p);
  if(p.money<s.pr)return false;
  const L=p.lvl||2;
  if(L===1)return p.money-s.pr>=120&&Math.random()<.7;
  if(L===3){const g0=groupOf(s);const pref=['orange','red','lb','pink','rail'].includes(g0);return p.money-s.pr>=(pref?10:60)||GROUPS[g0].length-1===countOwned(pi,g0)}
  const g=groupOf(s);const mine=countOwned(pi,g);
  const reserve=mine>0||s.t==='rail'?60:150;
  const completes=mine===GROUPS[g].length-1;
  const othersBlock=GROUPS[g].some(x=>G.props[x].o>=0&&G.props[x].o!==pi);
  if(completes)return p.money-s.pr>=20;
  if(othersBlock&&s.t==='p'&&p.money-s.pr<reserve*2)return false;
  return p.money-s.pr>=reserve;
}
async function offerBuy(p,s){
  let buy=false;
  if(p.ai)buy=aiWantsBuy(p,s);
  else{
    if(p.money<s.pr){await modal(deedHTML(s.i)+`<p style="color:#c62828;text-align:center">مش معاك فلوس تشتريها (${fmt(s.pr)}). هتتعرض في مزاد.</p>`,[{t:'تمام',v:1}])}
    else buy=await modal(deedHTML(s.i)+`<p style="text-align:center;font-size:16px">تشتري <b>${s.n}</b> بـ <b>${fmt(s.pr)}</b>؟</p>`,[{t:'✅ اشتري',c:'g',v:true},{t:'🔨 مزاد',c:'d',v:false}]);
  }
  if(buy){p.money-=s.pr;G.props[s.i].o=G.players.indexOf(p);sfx.cash();log(`${p.name} اشترى ${s.n} بـ ${fmt(s.pr)}`);render()}
  else await auction(s);
}
async function auction(s){
  log(`🔨 مزاد على ${s.n}`);
  let bid=0,leader=-1;let active=G.players.map((p,i)=>i).filter(i=>!G.players[i].out&&G.players[i].money>0);
  if(active.length<1)return;
  let passes=new Set();let guard=0;
  while(guard++<200){
    const cand=active.filter(i=>!passes.has(i));
    if(cand.length===0||(cand.length===1&&leader===cand[0]))break;
    for(const i of cand){
      if(passes.has(i))continue;
      if(leader===i)continue;
      const p=G.players[i];
      const inc=[10,50,100];

function aiManage(p){
  const pi=G.players.indexOf(p);
  // unmortgage when rich
  for(const i of ownedBy(pi)){if(G.props[i].m&&p.money>unmortCost(i)+400){unmortgage(pi,i)}}
  // build on best groups
  let guard=0;
  while(guard++<12){
    const L=p.lvl||2,rsv=L===3?120:L===1?600:250;
    const cands=ownedBy(pi).filter(i=>canBuild(pi,i)&&p.money-S[i].hc>=rsv);
    if(!cands.length)break;
    const HOT={orange:3,red:3,lb:2,pink:2,yellow:1};cands.sort((a,b)=>L===3?((HOT[S[b].g]||0)-(HOT[S[a].g]||0))||(S[a].pr-S[b].pr):S[b].pr-S[a].pr);
    build(pi,cands[0]);
  }
  render();
}
/* ========== AI TRADES ========== */
async function aiTrades(p){
  const pi=G.players.indexOf(p);
  if((p.lvl||2)===1)return;
  G.cool=G.cool||{};
  for(const g of Object.keys(GROUPS)){
    if(g==='rail'||g==='util')continue;
    const ids=GROUPS[g];
    if(countOwned(pi,g)!==ids.length-1)continue;
    const miss=ids.find(i=>G.props[i].o!==pi);
    const o=G.props[miss].o;if(o<0)continue;
    const q=G.players[o];if(q.out)continue;
    if(G.props[miss].h>0)continue;
    const key=pi+'_'+miss;if((G.cool[key]||0)>G.rounds)continue;
    const price=S[miss].pr;
    const offer=Math.min(Math.round(price*1.8/10)*10,p.money-80);
    if(offer<price*1.2)continue;
    G.cool[key]=G.rounds+(q.ai?8:25);
    // owner is giving up a prop; refuse if it completes nothing special but needs > 1.25x
    let ok;
    if(q.ai)ok=offer>=propValue(miss,o)*1.25+(countOwned(o,g)>1?price*.3:0);
    else ok=await modal(`<div class="big">🤝</div><h3 style="text-align:center">${p.name} عايز يشتري ${S[miss].n}</h3><p style="text-align:center">بيعرض ${fmt(offer)} (سعرها ${fmt(price)}). توافق؟</p>`,[{t:'✅ بيع',c:'g',v:true},{t:'❌ لا',c:'r',v:false}]);
    if(ok){p.money-=offer;q.money+=offer;G.props[miss].o=pi;sfx.cash();log(`🤝 ${p.name} اشترى ${S[miss].n} من ${q.name} بـ ${fmt(offer)}`);render()}
    else log(`${q.name} رفض عرض ${p.name} على ${S[miss].n}`);
  }
}

async function playTurn(p){
  const pi=G.players.indexOf(p);
  G.doubles=0;G.jailed=false;G.tradedThisTurn=false;
  toast(`دور ${p.tk} ${p.name}`);

      }

$('musBtn').onclick=()=>{music(!MUSIC);$('musBtn').style.opacity=MUSIC?1:.5};$('musBtn').style.opacity=.5;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&$('ov').classList.contains('hide')){const b=document.querySelector('#ctrl .btn.g');if(b){e.preventDefault();b.click()}}});
$('startBtn').onclick=startNew;
$('rulesBtn').onclick=rules;
$('menuBtn').onclick=menu;
$('muteBtn').onclick=()=>{MUTE=!MUTE;$('muteBtn').textContent=MUTE?'🔇':'🔊'};
$('contBtn').onclick=()=>{
  try{const s=JSON.parse(localStorage.getItem('bankelhaz_save')||'null');if(!s){toast('مفيش لعبة محفوظة');return}G=s;SPEED=G.speed||1;G.busy=false;enter()}catch(e){toast('مفيش لعبة محفوظة')}
};
drawSetup();
if(!localStorage.getItem('bankelhaz_save'))$('contBtn').style.display='none';
if(AUTO){window.__auto=()=>{pcount=4;drawSetup();document.querySelectorAll('#pset select').forEach(s=>s.value='a');startNew()}}
</script>
</body>
</html>
