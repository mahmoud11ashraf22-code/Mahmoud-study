  bs.forEach((x,j)=>{x.classList.remove("sel");if(j===q[2])x.classList.add("ok");else if(j===A[i])x.classList.add("bad")});
  if(A[i]===q[2])s++;
  /* EXPLAIN:START */if(q[3]){const ed=document.createElement("div");ed.className="exp";ed.innerHTML="<b>💡 الشرح:</b> "+q[3];document.getElementById("q"+i).appendChild(ed)}/* EXPLAIN:END */
 });
 qs.classList.add("done");
 const r=document.getElementById("res"),p=Math.round(s/Q.length*100);
 r.style.display="block";
 r.innerHTML='<div>نتيجتك</div><div class="n" id="totalScore">'+s+' / 50</div><div>'+p+'% — '+(p>=85?"ممتاز 🌟":p>=65?"جيد جداً 👏":p>=50?"مقبول 💪":"محتاج مراجعة 📚")+'</div><div style="color:var(--mu);font-size:.9rem">الإجابات الصحيحة بالأخضر والخاطئة بالأحمر</div>';
 sub.textContent="إعادة الامتحان";sub.classList.add("sec");
 window.scrollTo({top:0,behavior:"smooth"});
};
</script>
