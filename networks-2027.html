    q: 'علل: توضع الخوادم المعرضة للشبكة الخارجية مثل خادم الويب في المنطقة المعزولة (DMZ).',
    model: 'لحماية الشبكة الداخلية الحساسة؛ فإذا تعرض خادم الويب للاختراق، يبقى محجوزا في المنطقة المعزولة ولا يمنح المهاجم وصولاً مباشراً لباقي أجهزة المؤسسة الداخليّة.',
    points: 2
  },
  {
    type: 'essay',
    q: 'ما وظيفة «التوقيع الرقمي»؟',
    model: 'التحقق من هوية المرسل، وضمان سلامة البيانات من التعديل، وتحقيق خاصية عدم التنصل.',
    points: 2
  },
  {
    type: 'essay',
    q: 'اذكر فئات عوامل المصادقة الثلاث مع مثال لكل منها.',
    model: 'فئة المعرفة (شيء تعرفه) مثل: كلمة المرور أو رقم التعريف الشخصي (PIN). فئة المِلكية (شيء تملكه) مثل: الهاتف الذكي أو البطاقة الذكية. فئة السمات الشخصية (شيء أنت عليه) مثل: بصمة الإصبع أو التعرف على الوجه.',
    points: 2
  }
];

let timeLeft = 3600;
let timerInterval;

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    const display = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    const timerEl = document.getElementById('timer');
    timerEl.textContent = display;
    if (timeLeft <= 300) timerEl.classList.add('warning');
    if (timeLeft <= 60) timerEl.classList.add('danger');
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerEl.textContent = 'انتهى الوقت!';
      submitExam();
    }
  }, 1000);
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  questions.forEach((q, index) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>السؤال ${index + 1}: ${q.q}</h3>`;
    if (q.type === 'mcq') {
      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'options';
      q.options.forEach((opt, i) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="radio" name="q${index}" value="${i}"> ${opt}`;
        optionsDiv.appendChild(label);
      });
      div.appendChild(optionsDiv);
    } else {
      const textarea = document.createElement('textarea');
      textarea.name = `q${index}`;
      textarea.placeholder = 'اكتب إجابتك هنا...';
      div.appendChild(textarea);
    }
    container.appendChild(div);
  });
}

function normalizeText(text) {
  return text.toLowerCase()
    .replace(/[^؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿a-z0-9\s]/gi, '')
    .split(/\s+/)
    .filter(w => w.length > 1);
}

function calculateSimilarity(student, model) {
  if (!student.trim()) return 0;
  const sWords = new Set(normalizeText(student));
  const mWords = new Set(normalizeText(model));
  if (mWords.size === 0) return 0;
  let intersection = 0;
  for (let w of sWords) {
    if (mWords.has(w)) intersection++;
  }
  const union = sWords.size + mWords.size - intersection;
  const jaccard = union > 0 ? intersection / union : 0;
  const coverage = intersection / mWords.size;
  return Math.max(jaccard, coverage * 0.7);
}

function submitExam() {
  clearInterval(timerInterval);
  const studentName = document.getElementById('studentName').value.trim() || 'طالب';
  const resultsDiv = document.getElementById('results');
  resultsDiv.classList.remove('hidden');
  resultsDiv.innerHTML = `<h2 style="text-align:center; color:#0056b3;">نتائج الامتحان - ${studentName}</h2>`;
  
  let totalScore = 0;
  let maxScore = 0;

  questions.forEach((q, index) => {
    maxScore += q.points;
    const resultItem = document.createElement('div');
    resultItem.className = 'result-item';
    let score = 0;
    let feedback = '';

    if (q.type === 'mcq') {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      const selectedIndex = selected ? parseInt(selected.value) : -1;
      const isCorrect = selectedIndex === q.correct;
      score = isCorrect ? q.points : 0;
      resultItem.classList.add(isCorrect ? 'correct' : 'incorrect');
      feedback = `
        <p><strong>إجابتك:</strong> ${selected ? q.options[selectedIndex] : 'لم تجب'}</p>
        <p><strong>الإجابة الصحيحة:</strong> ${q.options[q.correct]}</p>
        <p class="score">الدرجة: ${score} / ${q.points}</p>
      `;
    } else {
      const answer = document.querySelector(`textarea[name="q${index}"]`).value;
      const sim = calculateSimilarity(answer, q.model);
      if (sim >= 0.65) score = q.points;
      else if (sim >= 0.35) score = Math.round(q.points * sim);
      else if (sim > 0.1) score = Math.round(q.points * 0.3);
      else score = 0;
      const cls = score === q.points ? 'correct' : score > 0 ? 'partial' : 'incorrect';
      resultItem.classList.add(cls);
      feedback = `
        <p><strong>إجابتك:</strong> ${answer || 'لم تجب'}</p>
        <div class="model-answer"><strong>الإجابة النموذجية:</strong> ${q.model}</div>
        <p class="score">درجة التشابه: ${(sim * 100).toFixed(0)}% | الدرجة: ${score} / ${q.points}</p>
      `;
    }
    totalScore += score;
    resultItem.innerHTML = `<h4>السؤال ${index + 1}</h4>${feedback}`;
    resultsDiv.appendChild(resultItem);
  });

  const totalDiv = document.createElement('div');
  totalDiv.className = 'total-score';
  totalDiv.innerHTML = `الدرجة الكلية: ${totalScore} / ${maxScore} (${((totalScore/maxScore)*100).toFixed(1)}%)`;
  resultsDiv.appendChild(totalDiv);

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'تم التصحيح';
  resultsDiv.scrollIntoView({ behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', () => {
  renderQuestions();
  startTimer();
});
</script>
