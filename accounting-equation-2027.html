function norm(s) { return s.toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/[.,،;:!?()«»"'-]/g, ' ').replace(/ـ/g, '').replace(/\s+/g, ' ').trim(); }
function tokens(s) {
  var stop = { 'في': 1, 'من': 1, 'إلى': 1, 'على': 1, 'أن': 1, 'إن': 1, 'ما': 1, 'هو': 1, 'هي': 1, 'كان': 1, 'يكون': 1, 'تم': 1, 'قد': 1, 'لا': 1, 'لم': 1, 'لن': 1, 'و': 1, 'أو': 1, 'ثم': 1, 'هذا': 1, 'هذه': 1, 'ذلك': 1, 'التي': 1, 'الذي': 1, 'مع': 1, 'عن': 1, 'بعد': 1, 'قبل': 1, 'بين': 1, 'عند': 1, 'كل': 1, 'أي': 1, 'كما': 1, 'لذلك': 1, 'لذا': 1, 'يتم': 1, 'تكون': 1, 'تستخدم': 1, 'يستخدم': 1 };
  return norm(s).split(' ').filter(function (w) { return w.length > 1 && !stop[w]; });
}
function similarity(a, b) {
  var A = {}; tokens(a).forEach(function (w) { A[w] = 1; });
  var B = tokens(b); var inter = 0; B.forEach(function (w) { if (A[w]) inter++; });
  var union = {}; tokens(a).forEach(function (w) { union[w] = 1; }); B.forEach(function (w) { union[w] = 1; });
  var u = Object.keys(union).length; if (!u || !B.length) return 0;
  return 0.55 * (inter / u) + 0.45 * (inter / B.length);
}
function termSim(a, b) {
  var x = norm(a), y = norm(b); if (!x) return 0; if (x === y) return 1;
  if (x.indexOf(y) >= 0 || y.indexOf(x) >= 0) return 0.9;
  var A = {}; tokens(a).forEach(function (w) { A[w] = 1; });
  var B = tokens(b); var inter = 0; B.forEach(function (w) { if (A[w]) inter++; });
  return B.length ? inter / B.length : 0;
}
function showResult() {
