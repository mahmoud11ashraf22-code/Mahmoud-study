<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان إلكتروني - التاريخ</title>
<style>
:root{--b:#1b5fd1;--bd:#0f3f94;--bl:#eaf2ff;--bm:#c9dcff;--w:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bl);color:var(--bd);line-height:1.9}
header{background:var(--w);border-bottom:4px solid var(--b);text-align:center;padding:14px 10px}
header img{width:120px;height:120px;border-radius:50%;border:4px solid var(--b);object-fit:cover}
header h1{margin:6px 0 0;font-size:22px;color:var(--b)}
.bar{position:sticky;top:0;z-index:5;background:var(--b);color:var(--w);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px}
.bar input{padding:8px 12px;border-radius:8px;border:0;font-size:15px;min-width:200px;flex:1;max-width:320px;font-family:inherit}
#timer{font-size:22px;font-weight:bold;background:var(--w);color:var(--b);padding:2px 16px;border-radius:8px;direction:ltr}
button{font-family:inherit;cursor:pointer}
#showBtn{background:var(--w);color:var(--b);border:2px solid var(--w);padding:8px 18px;border-radius:8px;font-weight:bold;font-size:15px}
main{max-width:820px;margin:16px auto;padding:0 10px}
.q{background:var(--w);border:1px solid var(--bm);border-right:6px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}
.q h3{margin:0 0 4px;font-size:15px;color:var(--b)}
.q .t{font-size:17px;font-weight:bold;margin-bottom:8px}
.o{display:block;width:100%;text-align:right;background:var(--bl);border:1px solid var(--bm);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:16px;color:var(--bd)}
.o:hover:not([disabled]){background:var(--bm)}
.o.ok{background:var(--b);color:var(--w);border-color:var(--bd)}
.o.no{background:var(--w);color:var(--bd);border:2px dashed var(--b);text-decoration:line-through}
textarea{width:100%;min-height:90px;border:1px solid var(--b);border-radius:8px;padding:10px;font-family:inherit;font-size:16px;color:var(--bd)}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--bl);border:1px solid var(--b);font-size:15px;display:none}
.fb b{color:var(--b)}
#res{display:none;background:var(--b);color:var(--w);border-radius:12px;padding:18px;text-align:center;margin-bottom:14px}
#res .big{font-size:30px;font-weight:bold}
footer{text-align:center;padding:16px;background:var(--w);border-top:4px solid var(--b);margin-top:20px}
footer a{color:var(--b);font-weight:bold}
</style>
</head>

["e","اقتصرت سياسة الحملة الفرنسية في مصر على الجانب العسكري فقط. أثبت صحة أو خطأ العبارة مستندًا إلى الشواهد التاريخية.","العبارة خطأ؛ حيث لم تقتصر الحملة الفرنسية على الجانب العسكري فقط، بل اصطحب نابليون بونابرت علماء في مختلف العلوم والفنون، وتم اكتشاف حجر رشيد وفك رموزه، وأُنشئت الدواوين التي شارك فيها المصريون وتعلموا من خلالها أساليب الحكم والاستشارة."],
["e","فسّر العبارة الآتية: «اعتُبرت مشاركة المرأة المصرية في ثورة 1919م تطورًا فارقًا في الوعي السياسي».","حيث ارتفع الوعي السياسي وأصبح كل من الرجل والمرأة يمثل ركنًا مهمًا في المجتمع؛ فقد ساهمت المرأة في ثورة 1919م، ومنهن هدى شعراوي وصفية زغلول اللاتي ساعدن في المظاهرات وطالبن بحرية المرأة وحقوقها."],
["e","دلّل تاريخيًا على صحة العبارة الآتية: «لم يكن حريق القاهرة في 26 يناير 1952م حدثًا عشوائيًا، بل نتيجة تراكمية لتدهور الأوضاع في البلاد».","حيث كانت هناك ظروف داخلية وخارجية متدهورة، مثل غياب العدالة الاجتماعية وتزوير الانتخابات، ومقتل الشرطة في الإسماعيلية، وحادثة 4 فبراير، وإلغاء معاهدة 1936م، مما أدى إلى تراكم الغضب الشعبي."],
["e","ما النتائج المترتبة على: «هيمنة القصر الملكي والاحتلال البريطاني على الحياة الدستورية منذ عام 1923م»؟","أدى ذلك إلى تقييد عمل المؤسسات الدستورية وإضعاف الأحزاب السياسية، وعجز النظام السياسي القائم عن تحقيق الاستقلال الكامل والتنمية الوطنية."],
["e","ما مدى صحة العبارة الآتية: «نجح محمد فريد في مقاومته ضد الاحتلال البريطاني في الحفاظ على سيادة الدولة المصرية»؟","العبارة خطأ؛ حيث استمر الاحتلال البريطاني ولم ينجح في إنهاء وجوده أو السيطرة الكاملة على البلاد، بل استمر الاحتلال."],
["e","وضّح الفرق بين: خروج بريطانيا من مصر في 20 شهرًا واستقلال حقيقي دون أي شروط، واستقلال مصر بعد تصريح 28 فبراير 1922م واتفاقية الجلاء عام 1954م.","تصريح 28 فبراير 1922م منح مصر استقلالًا شكليًا مقيدًا بالتحفظات الأربعة، بينما اتفاقية الجلاء عام 1954م حققت الجلاء الفعلي للقوات البريطانية خلال عشرين شهرًا وأنهت الوجود العسكري البريطاني في مصر."],
["e","برهن على صحة العبارة الآتية: «تم تقليص حجم الجيش المصري في القرن 19 أكثر من مرة».","حدث ذلك في عهد محمد علي بمقتضى معاهدة لندن 1840م، حيث تم تحديد حجم الجيش وتقليصه، ثم في عهد الخديو إسماعيل، حيث تعرض الجيش للتقليص والقيود نتيجة التدخل الأجنبي والديون."],
["e","ما رأيك في هذه العبارة: «استُخدم العسكري في مصر من أواخر القرن 18 أداةً من أدوات الاستعمار الجديد»؟","أوافق على ذلك جزئيًا؛ حيث استُخدمت الوسائل غير العسكرية كالضغوط المالية والديون والإعلام والتدخل الثقافي والسياسي كأدوات للنفوذ والسيطرة بجانب القوة العسكرية."],
["e","ما النتائج المترتبة على: «وضع نظام المراقبة المالية الثنائية عام 1876م»؟","أدى ذلك إلى سيطرة الأجانب على موارد الدولة، وتقييد حرية الحكومة المصرية في الشؤون المالية، وتوجيه الإنفاق بما يخدم مصالح الدائنين."],
["m","ارتبطت مكتسبات المرأة المصرية في عهد جمال عبد الناصر بشكل وثيق بـ .......",["الثروات الصناعية.","القاعدة الجماهيرية.","ممارسة الحياة التشريعية.","القضاء على الإقطاع."],2],

["m","«الاستعمار الجديد» مصطلح يتجاوز المفهوم التقليدي للاحتلال من خلال التركيز على .......",["فرض سياسة التبعية الاقتصادية والمالية.","احتكار إنتاج الوسائل الرقمية الحديثة.","بناء تحالفات عسكرية مع دول كبرى.","الهيمنة الفكرية وتوجيه الإدراك البشري."],3],
["m","تستطيع الدول النامية التغلب على سياسات الاستعمار الجديد باحتكار التكنولوجيا المتقدمة من خلال .......",["إقامة برامج توعية للشباب.","التعامل المادي مع المؤسسات الدولية.","التوسع في التعليم والبحث العلمي.","إقامة نظم سياسية ديمقراطية."],2],
["m","كل ما يلي يُعد من أدوات الاستعمار الجديد ويخرج عنها .......",["التسلل عبر القروض ورفع الديون الدولية.","ابتكار البنية التحتية لمراكز البيانات والإنترنت.","تغلغل مرتكزات الهوية كالدين واللغة والتاريخ.","التحكم في توجيه واتخاذ القرارات الوطنية."],1],
["e","اقتصرت سياسة الحملة الفرنسية في مصر على الجانب العسكري فقط. أثبت صحة أو خطأ العبارة مستندًا إلى الشواهد التاريخية.","العبارة خطأ؛ حيث لم تقتصر الحملة الفرنسية على الجانب العسكري فقط، بل اصطحب نابليون علماء في مختلف العلوم والفنون، واكتُشف حجر رشيد وفُكّت رموزه، وأُنشئت الدواوين وشارك فيها المصريون وتعلموا من خلالها المشاركة في إدارة الشؤون العامة."],
["e","فسّر العلاقة بين: مقاومة المصريين للحملة الفرنسية، واتجاه نابليون إلى سياسة القمع.","العلاقة طردية؛ فكلما اشتدت مقاومة المصريين للحملة الفرنسية، كما في ثورتي القاهرة الأولى والثانية، لجأ نابليون إلى سياسة القمع والشدة لإخماد الثورات وإرهاب الأهالي ومنعهم من تكرار المقاومة."],
["e","«رغم قصر مدة الحملة الفرنسية فإن آثارها تجاوزت مدة وجودها العسكري في مصر». ناقش العبارة مستشهدًا بأدلة تاريخية.","حيث تركت الحملة آثارًا عميقة تجاوزت مدة بقائها، ومنها لفت أنظار العالم لموقع مصر وأهميتها، وإيقاظ الوعي الوطني لدى المصريين، واكتشاف حجر رشيد، والاهتمام بالعلوم والدراسات العلمية، وإنشاء المجمع العلمي، مما أثّر في تطور الحياة الفكرية والسياسية لاحقًا."],
["e","حدّد العلاقة بين: مشروع محمد علي لبناء قوة مصر، وموقف القوى الأوروبية منه.","أدى نمو قوة محمد علي الذاتية وتوسعاته الخارجية إلى قلق القوى الأوروبية خشية اختلال توازن القوى الدولية وتهديد مصالحها، فتدخلت للحد من قوته وتقليص نفوذه، كما حدث في معاهدة لندن 1840م."],
["e","فسّر: مثلت اتفاقية بلطة ليمان عام 1838م أحد مظاهر التوسع الاقتصادي البريطاني في الشرق.","لأنها أسقطت نظام الاحتكار الذي طبقه محمد علي، وفتحت الأسواق المصرية أمام المنتجات الأجنبية والبريطانية، مما أضعف الصناعة الوطنية وحقق مصالح بريطانيا التجارية والاقتصادية."],
["e","حلّل: أثر معاهدة لندن 1840م على مستقبل الدولة المصرية.","أدت المعاهدة إلى حصر حكم مصر في أسرة محمد علي، وتقليص حجم الجيش المصري، والحد من توسعاته الخارجية وتبعيته للدولة العثمانية، مما أثّر على استقلال مصر الكامل ومشروعها التوسعي."],
["e","«تحولت الديون في تاريخ مصر الحديث من وسيلة لتمويل التنمية إلى أداة للتدخل الأجنبي». إلى أي مدى توافق على هذه العبارة؟","أوافق بشدة على هذه العبارة؛ فبعد أن بدأت القروض لتمويل المشروعات والتحديث، أدى سوء الإدارة المالية وتراكم الفوائد إلى عجز الحكومة عن السداد، فاستغلت الدول الأوروبية ذلك كذريعة للتدخل في شؤون مصر المالية ثم السياسية."],
["e","ماذا كان يحدث لو لم تتراكم الديون على مصر في عهد خلفاء محمد علي؟","لما وجدت الدول الأوروبية ذريعة للتدخل في شؤون مصر الداخلية والمالية، ولحافظت مصر على استقلالها المالي والسياسي، ولما فُرضت الرقابة المالية الثنائية، ولما تزايد النفوذ الأجنبي بالصورة التي حدثت."],
["e","«يمكن اعتبار الرقابة المالية الأجنبية فقدانًا فعليًا لجزء من استقلال مصر». قيّم هذه العبارة باستخدام الأدلة التاريخية.","العبارة صادقة؛ لأن الرقابة المالية الأجنبية منحت المراقبين الأجانب سلطة الاطلاع على الإيرادات والمصروفات والتدخل في قرارات الميزانية والإنفاق الحكومي، مما قيّد إرادة الحكومة المصرية وأضعف سيادتها الوطنية."],
["e","اربط بين المفاهيم الثلاثة الآتية: النهضة، والديون، والتبعية.","سعت مصر في عهد الخديو إسماعيل إلى تحقيق النهضة والتحديث، فلجأت إلى الاستدانة الخارجية لتمويل مشروعاتها، ومع تراكم الديون وعجز السداد فُتح الباب للتدخل الأجنبي الذي أدى إلى التبعية السياسية والاقتصادية."],
["e","«لم تكن مشكلة مصر في العصر الحديث هي التدخل الخارجي وحده، وإنما هناك عوامل داخلية». حلّل مدى صحة هذه العبارة مستندًا إلى أدلة تاريخية.","العبارة صحيحة؛ فإلى جانب التدخل الأجنبي، أسهمت عوامل داخلية مثل سوء الأوضاع المالية، وغياب العدالة الاجتماعية، واستبداد الحكم، وتزوير الانتخابات، وضعف الأحزاب في تعميق الأزمات الوطنية."],
["e","حلّل العلاقة بين: الثورة العرابية، والتدخل العسكري البريطاني في مصر عام 1882م.","تنامت مطالب الثورة العرابية الإصلاحية والدستورية ورفض التدخل الأجنبي، مما هدد نفوذ ومصالح بريطانيا وفرنسا في مصر، فاستغلت بريطانيا الأحداث الداخلية لتتدخل عسكريًا وتحتل مصر عام 1882م."],
["e","فسّر: لماذا يُعد الاحتلال البريطاني لمصر نموذجًا للحكم غير المباشر؟","لأن بريطانيا أبقت ظاهريًا على الشكل الإداري والقانوني للدولة المصرية، من الخديوية والوزارات، بينما كانت السلطة الفعلية والقرارات الحاسمة في يد المعتمد البريطاني والمستشارين الإنجليز."],
["e","حلّل: سياسات الاحتلال البريطاني في مصر من حيث: السيطرة على القضاء.","سعى الاحتلال البريطاني إلى السيطرة على النظام القضائي وتوجيهه بما يخدم مصالحه ويحمي الأجانب، مما أثّر على استقلال القضاء وحقق امتيازات قضائية للأجانب على حساب السيادة الوطنية."],
["e","«كان توجيه الاقتصاد المصري نحو زراعة القطن في مصلحة مصر والمحتل في الوقت نفسه». ناقش العبارة، موضحًا الآثار السلبية لهذه السياسة.","رغم أن زراعة القطن جلبت عوائد نقدية للمزارعين والدولة، فإنها جعلت الاقتصاد المصري معتمدًا على محصول واحد لخدمة مصانع النسيج البريطانية. ومن آثارها السلبية: إهمال الصناعات الوطنية وتطويرها، وتعرض الاقتصاد لهزات حادة بتقلب أسعار القطن عالميًا، وتهديد الأمن الغذائي بتقليص مساحات المحاصيل الغذائية."],
["e","إلى أي مدى يمكن اعتبار مقاومة المصريين للاحتلال الفرنسي عاملًا مهمًا في تطور الوعي الوطني المصري لاحقًا؟","إلى حد كبير؛ فقد أثبتت مقاومة المصريين للحملة الفرنسية قدرة الشعب على التحرك والرفض الجماعي للاحتلال، وأسهمت الاحتكاكات والخبرات الناتجة عنها في تنمية الوعي الوطني والمطالبة بالحقوق والحرية في المراحل التالية."],
["e","ما العلاقة بين: إضعاف الجيش المصري والسيطرة على التعليم، وإطالة أمد الاحتلال البريطاني؟","علاقة وثيقة؛ فبتقليص الجيش وإضعاف قوته العسكرية، وتقييد التعليم وتوجيهه لإخراج موظفين دون تنمية روح النضال والوعي السياسي، أضعف الاحتلال قدرات المقاومة المنظمة وأطال أمد وجوده في البلاد."],
["e","إلى أي مدى مثّلت ثورة 1919م تطورًا حقيقيًا في طبيعة المقاومة المصرية مقارنةً بالثورة العرابية؟ ثم ناقش ذلك من حيث: القوى المشاركة، والأهداف.","مثّلت ثورة 1919م تطورًا كبيرًا؛ فمن حيث القوى المشاركة أصبحت ثورة شعبية شاملة شاركت فيها مختلف طبقات وفئات الشعب المصري، والمرأة إلى جانب الرجل. ومن حيث الأهداف اتسعت لتشمل الاستقلال التام، وإنهاء الحماية البريطانية، وإقامة حياة نيابية ودستورية تعبّر عن إرادة الأمة."]
];
const L=["أ","ب","ج","د"];
const $=id=>document.getElementById(id);
let done=false,sel={};
$("eg").textContent=EG;
$("qs").innerHTML=D.map((q,i)=>{
 const h=`<div class="q" id="q${i}"><h3>السؤال ${i+1} (${q[0]=="m"?"اختياري":"مقالي"}) — ${q[0]=="m"?MG:EG} درجة</h3><div class="t">${q[1]}</div>`;
 if(q[0]=="m")return h+q[2].map((o,j)=>`<button class="o" onclick="pick(${i},${j})">${L[j]}) ${o}</button>`).join("")+`<div class="fb" id="f${i}"></div></div>`;
 return h+`<textarea id="a${i}" placeholder="اكتب إجابتك هنا..."></textarea><div class="fb" id="f${i}"></div></div>`;
}).join("");
function pick(i,j){
 if(sel[i]!==undefined||done)return;
 sel[i]=j;const q=D[i],ok=j==q[3];
 const bs=document.querySelectorAll("#q"+i+" .o");
 bs.forEach((b,k)=>{b.disabled=true;if(k==q[3])b.classList.add("ok");else if(k==j)b.classList.add("no")});
 const f=$("f"+i);f.style.display="block";
 f.innerHTML=(ok?"✔ إجابة صحيحة":"✘ إجابة خاطئة")+` — الإجابة الصحيحة: <b>${L[q[3]]}) ${q[2][q[3]]}</b> — الدرجة: <b>${ok?MG:0} / ${MG}</b>`;
}
const SW=new Set("من في على الى عن ان او ثم كما قد التي الذي هذا هذه ذلك تلك كان كانت بين حتى لقد ما لا هو هي مما الذين اللاتي حيث بعد قبل عند كل".split(" "));
function norm(s){return s.replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^\u0621-\u064A0-9\s]/g," ")}
function stem(w){w=w.replace(/^(وال|بال|لل|ال|و|ب|ل)(?=.{3})/,"");return w.replace(/(ات|ون|ين|ها|ه|ي)$/,m=>w.length>4?"":m)}
function toks(s){return norm(s).split(/\s+/).filter(w=>w.length>2&&!SW.has(w)).map(stem).filter(w=>w.length>1)}
function sim(a,m){
 const A=toks(a),M=[...new Set(toks(m))];
 if(!M.length||!A.length)return 0;
 let c=0;
 M.forEach(w=>{if(A.some(x=>x==w||(x.length>=4&&w.length>=4&&(x.startsWith(w)||w.startsWith(x)))))c++});
 return c/M.length;
}
function finish(){
 if(done)return;
 if(!$("name").value.trim()){alert("من فضلك اكتب اسم الطالب أولًا");$("name").focus();return}
 done=true;clearInterval(tm);
 let tot=0,max=0;
 D.forEach((q,i)=>{
  const f=$("f"+i);f.style.display="block";
  if(q[0]=="m"){
   max+=MG;if(sel[i]===undefined){
    document.querySelectorAll("#q"+i+" .o").forEach((b,k)=>{b.disabled=true;if(k==q[3])b.classList.add("ok")});
    f.innerHTML=`لم تتم الإجابة — الإجابة الصحيحة: <b>${L[q[3]]}) ${q[2][q[3]]}</b> — الدرجة: <b>0 / ${MG}</b>`;
   }else if(sel[i]==q[3])tot+=MG;
  }else{
   max+=EG;const t=$("a"+i);t.readOnly=true;
   const r=sim(t.value,q[2]);
   let g=r>=0.6?EG:Math.round(EG*(r/0.6)*2)/2;
   if(r<0.1)g=0;tot+=g;
   f.innerHTML=`نسبة التشابه: <b>${Math.round(r*100)}%</b> — الدرجة: <b>${g} / ${EG}</b><br>الإجابة النموذجية: ${q[2]}`;
  }
 });
 const r=$("res");r.style.display="block";
 r.innerHTML=`<div>الطالب: ${$("name").value.trim().replace(/</g,"&lt;")}</div><div class="big">${tot} / ${max}</div><div>النسبة: ${Math.round(tot/max*100)}%</div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
let s=7200;
const tm=setInterval(()=>{s--;const m=Math.floor(s/60),x=s%60;$("timer").textContent=String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");
 if(s<=0){clearInterval(tm);if(!$("name").value.trim())$("name").value="طالب";finish();}},1000);
</script>
</body>
